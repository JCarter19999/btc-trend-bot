[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-trend-bot"
version = "1.0.0"
description = "Research-first Bitcoin trend backtester and local paper bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6.0,<7",
  "matplotlib>=3.8,<4",
  "ccxt>=4.4,<5",
  "coinbase-advanced-py>=1.8,<2",
]

[project.scripts]
btc-trend-bot = "btc_trend_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
