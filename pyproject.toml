[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-trend-bot"
version = "3.0.0"
description = "Research-first Bitcoin trend backtester and local paper bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6.0,<7",
  "matplotlib>=3.8,<4",
  "ccxt>=4.4,<5",
  "coinbase-advanced-py>=1.8,<2",
  "streamlit>=1.38,<2",
  "joblib>=1.4,<2",
  "pyarrow>=17,<20",
  "scikit-learn>=1.5,<2",
  "requests>=2.32,<3",
  "yfinance>=0.2.54,<1",
  "schwab-py>=1.5,<2",
  "thetadata>=1.0.9,<2",
  "python-dotenv>=1.2,<2",
]

[project.scripts]
btc-trend-bot = "btc_trend_bot.cli:main"
btc-v1 = "btc_trend_bot.v1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
