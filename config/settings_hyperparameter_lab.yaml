# Immutable v0.9 state goal.  This is always evaluated on train, validation,
# test, and full data even if none of the sampled candidates beat it.
baseline:
  id: original_goal_time144_t25_s65
  type: exit_variant
  exit_mode: time_capture
  target_bps: 25
  stop_bps: 65
  minimum_hold_bars_5m: 0
  maximum_hold_bars_5m: 144

# Deliberately constrained neighborhood around the v0.9 winner. Random search
# avoids an expensive full Cartesian grid while still examining interactions.
search_space:
  exit_mode:
    type: choice
    values: [time_capture, breakeven_lock, activated_trailing]
  target_bps:
    type: int
    low: 20
    high: 40
    step: 5
  stop_bps:
    type: int
    low: 50
    high: 85
    step: 5
  maximum_hold_bars_5m:
    type: choice
    values: [72, 96, 120, 144, 192]
  minimum_hold_bars_5m:
    type: choice
    values: [0, 6, 12]
  lock_activation_bps:
    type: choice
    values: [15, 20, 25, 30]
  lock_bps:
    type: choice
    values: [-5, 0, 5, 10]
  activation_bps:
    type: choice
    values: [15, 20, 25, 30, 35]
  trail_bps:
    type: choice
    values: [8, 10, 12, 15, 20]
