# Interim deployment settings for equity daily paper trading using yfinance as
# the live-data source, while Schwab API access is pending approval. Same
# state machine, ledger schema, and safety rules as the Schwab path in
# run_equity_paper_step.py -- only the data source and ledger/lock paths
# differ, so the two can run side by side without colliding. Strategy
# parameters live in strategy_config below (the same frozen promoted
# snapshot the Schwab deployment uses), NOT here.
#
# Swap to config/settings_schwab_equity_paper.yaml once Schwab credentials are
# approved; do not just flip data_source here to "schwab" (that config also
# carries the Schwab-specific token_path and a separate ledger history).
strategy_config: config/schwab_paper_strategy.yaml

data_source: yfinance

schwab:
  token_path: runtime/schwab_token.json   # unused when data_source is yfinance
  lookback_days: 1400   # trailing calendar days fetched per symbol on each step

paper:
  ledger_db_path: runtime/equity_yfinance_paper.sqlite3
  lock_path: runtime/equity_yfinance_paper.lock
  selection: ridge   # ridge | random | simple_trend -- controls exist for parity
                      # with the backtest diagnostics; real deployment stays "ridge"
  # Optional Supabase telemetry mirror (see sql/003_equity_paper_runs.sql). Reads
  # SUPABASE_URL/SUPABASE_SECRET_KEY from the environment; silently a no-op if
  # unset. Both defaults shown below and normally don't need overriding.
  # supabase_table: equity_paper_runs
  # supabase_outbox_path: runtime/equity_yfinance_paper_supabase_outbox.jsonl
