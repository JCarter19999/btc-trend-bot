# CPU-only options strategy router config (Phase 1).
# See equity_v2_4_research/OPTIONS_ROUTER_PHASE1.md for scope.

data:
  entry_dir: data/opra_spx
  exit_dir: data/opra_spx_exit
  underlying: "^GSPC"          # signal + payoff reference (SPX index)
  confirmation_symbols: ["SPY", "QQQ", "IWM", "^VIX"]
  first_hour_bars_5m: 12        # 9:30 -> 10:30 ET
  trailing_window_days: 5       # rolling lookback for "recent baseline" features (range/volume avg)

regimes:
  bull_return_threshold: 0.0015     # first-hour return above this -> bullish
  bear_return_threshold: -0.0015    # first-hour return below this -> bearish
  moderate_return_threshold: 0.0005 # smaller move still counts as directional bias
  clv_bull_threshold: 0.70
  clv_bear_threshold: 0.30
  efficiency_ratio_trend_threshold: 0.55
  efficiency_ratio_chop_threshold: 0.35
  trend_r2_threshold: 0.35
  expansion_range_multiple: 1.5     # first-hour range vs trailing-10d avg range
  expansion_vix_change_threshold: 0.03
  vwap_crossing_chop_threshold: 3
  min_confidence: 0.4

strategy_map:
  BULL_TREND: [call_debit_spread]
  BEAR_TREND: [put_debit_spread]
  VOLATILITY_EXPANSION: [long_straddle, long_strangle]
  MODERATE_BULL: [put_credit_spread]
  MODERATE_BEAR: [call_credit_spread]
  CHOP_RANGE: []
  NO_TRADE: []

structures:
  strike_distance_points: 7.5   # 5-10 SPX points OTM, per user instruction
  credit_spread_width_points: 25.0

risk:
  account_value: 5000.0
  max_risk_pct_per_trade: 0.02   # 2% of account = $100 max planned loss
  max_daily_loss_pct: 0.04
  max_weekly_loss_pct: 0.08
  consecutive_loss_cooldown: 3
  cooldown_trades: 5

exit_policy:
  mode: noon_if_profit_target_met   # always_hold | always_noon | noon_if_profit_target_met
  profit_target_pct: 0.20
  hard_stop_pct: -0.50

no_trade_filters:
  max_entry_spread_pct_of_mid: 0.15
  min_net_expectancy: 0.0
